name: mammal-diversity
title: MDD
adopt-info: mammal-diversity
summary: Mammal Diversity Database explorer
description: |
  A cross-platform application to access the Mammal Diversity Database. It
  features offline access, advanced search with data filtering, and support to
  export a subset of the data to a Comma-Separated Values (CSV) or JSON file.
icon: assets/icons/favicon512.png
license: MIT
website: https://github.com/mammaldiversity/mdd_app
source-code: https://github.com/mammaldiversity/mdd_app
issues: https://github.com/mammaldiversity/mdd_app/issues
contact: https://github.com/mammaldiversity/mdd_app/issues

base: core24
grade: stable
confinement: strict

lint:
  ignore:
    # Shipped by the jni plugin for Android; never loaded on Linux.
    - library:
        - app/lib/libdartjni.so

platforms:
  amd64:

apps:
  mammal-diversity:
    command: app/mdd
    extensions: [gnome]
    plugs:
      - network
      - home

parts:
  mammal-diversity:
    # Builds everything from a clean checkout, so the snap also builds on
    # Launchpad / snapcraft.io, which only clone the repository: it fetches the
    # latest MDD and MIL data, regenerates the database and images with the
    # Rust CLI, then runs `flutter build linux --release`.
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    build-packages:
      - curl
      - pkg-config
      - liblzma-dev
      - libstdc++-12-dev
    build-environment:
      # rustup is installed in override-build; the Rust native assets hook
      # also needs it on PATH during `flutter build`.
      - PATH: "$HOME/.cargo/bin:$PATH"
    organize:
      "*": app/
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' "$CRAFT_PART_SRC/pubspec.yaml")"
    override-build: |
      if ! command -v rustup >/dev/null 2>&1; then
        # The toolchain itself comes from rust/rust-toolchain.toml.
        curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      fi
      # Fetches the latest MDD.zip and MIL release, then generates mdd.db,
      # mil.json, MIL images and data_version.json under assets/.
      ./tools/generate_prefilled_db.sh
      rm -rf data build/linux
      craftctl default
