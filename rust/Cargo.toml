[package]
name = "rust_lib_mdd"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flate2 = "1.1.*"
flutter_rust_bridge = "=2.13.0"
mdd_api = "0.10.1"
tempfile = "3.23.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.*"
tar = "0.4.*"
toml = "1.1.2"
zip = { version = "8.6.*", features = ["deflate"] }
rusqlite = { version = "0.32.*", features = ["bundled"] }
regex = "1.*"
clap = { version = "4.5.*", features = ["derive"] }
