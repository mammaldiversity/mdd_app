name: releases

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      matrix:
        # The Linux tar.gz requires a glibc at least as new as this runner's.
        os: ["windows-latest", "ubuntu-latest"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      # The Native Assets build hook shells out to rustup and relies on it
      # auto-installing the channel and cross-compilation targets declared in
      # rust/rust-toolchain.toml. Pinning a separate toolchain here would leave
      # those targets uninstalled, so warm the pinned one instead.
      - name: Setup Rust
        working-directory: rust
        run: rustup show active-toolchain

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup NuGet
        if: ${{ runner.os == 'Windows' }}
        uses: NuGet/setup-nuget@v4

      - name: Verify WebView2 runtime
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $clientId = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $paths = @(
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$clientId",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientId"
          )
          if (-not ($paths | Where-Object { Test-Path $_ })) {
            throw 'Microsoft Edge WebView2 Runtime is not installed.'
          }

      # Fetches the latest MDD.zip and MIL release, then generates mdd.db,
      # mil.json, MIL images and the data stamp.
      - name: Generate SQLite Database
        run: ./tools/generate_prefilled_db.sh

      - name: Cleanup temporary data
        run: |
          echo "Removing unneeded source files to reduce app size"
          rm -rf data
          
      - run: |
          flutter pub get
          flutter analyze

      - name: Build Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          flutter build linux --release

      - if: ${{ runner.os == 'Windows' }}
        run: |
          flutter build windows --release

      # Builds the snap from source in its own environment (fetching the
      # latest data itself); it does not use the bundle built above.
      - name: Build Snap
        if: ${{ runner.os == 'Linux' }}
        id: snap
        uses: snapcore/action-build@v1

      - name: Compress Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "Compressing files..."
          mkdir mdd
          mv build/linux/x64/release/bundle/* mdd
          tar -czvf mdd-Linux-x86_64.tar.gz mdd

      - name: Compress Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "Creating folder..."
          mkdir mdd
          echo "Compressing files..."
          mv build/windows/x64/runner/Release/* mdd
          powershell Compress-Archive -Path mdd -DestinationPath mdd-Windows-x86_64.zip

      - name: Extract Release Notes
        run: |
          awk '/^## /{flag=0} /^## What'\''s new/{flag=1} flag' README.md > release_notes.md

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            mdd-Linux-x86_64.tar.gz
            mammal-diversity_*.snap
            mdd-Windows-x86_64.zip
          fail_on_unmatched_files: false
