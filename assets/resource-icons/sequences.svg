<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- A sequence alignment: rows of base cells, solid where they differ. -->
  <g fill="#808080" fill-opacity="0.4">
    <rect x="3" y="4" width="18" height="4" rx="1.4"/>
    <rect x="3" y="10" width="18" height="4" rx="1.4"/>
    <rect x="3" y="16" width="12" height="4" rx="1.4"/>
  </g>
  <g fill="#000000">
    <rect x="7.6" y="4" width="3" height="4" rx="1"/>
    <rect x="15.4" y="10" width="3" height="4" rx="1"/>
    <rect x="3" y="16" width="3" height="4" rx="1"/>
    <rect x="11" y="16" width="4" height="4" rx="1"/>
  </g>
</svg>
